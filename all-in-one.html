<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="统一访问生活有据、信息素养框架、参考文献学习、GB/T 7714 和高校培训图谱。">
  <title>信息素养与生活检索 · 一站式工作台</title>
  <style>
    :root{color-scheme:light;--ink:#172944;--muted:#69768c;--line:#e0e6f0;--blue:#2854db;--paper:#f5f7fb;--white:#fff}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,"PingFang SC","Microsoft YaHei",sans-serif}
    .topbar{display:flex;align-items:center;gap:24px;padding:12px 22px;background:var(--white);border-bottom:1px solid var(--line);z-index:2}
    .brand{flex:none;color:var(--ink);font-weight:800;text-decoration:none;font-size:17px}.brand span{display:block;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.08em}
    nav{display:flex;align-items:center;gap:7px;overflow-x:auto;scrollbar-width:thin}nav button{flex:none;border:0;border-radius:9px;padding:10px 13px;background:transparent;color:var(--muted);font:inherit;cursor:pointer}nav button:hover{background:#f0f3fa;color:var(--ink)}nav button[aria-selected="true"]{background:#eaf0ff;color:var(--blue);font-weight:700}
    .workspace{position:relative;flex:1;min-height:0}.workspace iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}.workspace iframe[hidden]{display:none}
    .mobile-title{display:none}
    @media(max-width:700px){.topbar{display:block;padding:9px 12px}.brand{display:none}nav{gap:4px}nav button{padding:9px 11px;font-size:13px}.workspace{min-height:0}}
    .course-link{display:inline-block;flex:none;color:var(--blue);font-weight:650;text-decoration:none;padding:8px 10px;border-radius:9px}.course-link:hover,.course-link:focus-visible{background:#eaf0ff}
  @media(max-width:700px){.course-link{padding:5px 11px;font-size:13px}}
</style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./all-in-one.html">一站式工作台<span>生活检索 · 信息素养学习</span></a>
    <nav role="tablist" aria-label="选择网页">
      <button id="tab-life" role="tab" aria-selected="true" aria-controls="page-life" data-page="life">生活有据</button>
      <button id="tab-framework" role="tab" aria-selected="false" aria-controls="page-framework" data-page="framework" tabindex="-1">信息素养框架</button>
      <button id="tab-references" role="tab" aria-selected="false" aria-controls="page-references" data-page="references" tabindex="-1">参考文献学习</button>
      <button id="tab-standard" role="tab" aria-selected="false" aria-controls="page-standard" data-page="standard" tabindex="-1">GB/T 7714—2025</button>
      <button id="tab-training" role="tab" aria-selected="false" aria-controls="page-training" data-page="training" tabindex="-1">高校培训图谱</button>
    </nav>
    <a class="course-link" href="https://information-literacy-course-atlas.xingmf.chatgpt.site/">信息素养概念图谱 ↗</a>
  </header>
  <main class="workspace" aria-label="网页内容">
    <iframe id="page-life" title="生活有据：政府公开信息检索" src="./index.html"></iframe>
    <iframe id="page-framework" title="高等教育信息素养框架互动知识图谱" src="./il-framework.html" hidden></iframe>
    <iframe id="page-references" title="参考文献互动学习网站" src="./ref-learning.html" hidden></iframe>
    <iframe id="page-standard" title="GB/T 7714—2025文献类型与代码全景图" src="./gbt7714.html" hidden></iframe>
    <iframe id="page-training" title="高校信息素养培训图谱" src="./training-atlas.html" hidden></iframe>
  </main>
  <script>
    const tabs=[...document.querySelectorAll('[role="tab"]')];
    const frames=[...document.querySelectorAll('.workspace iframe')];
    function activate(tab,focus=false){
      tabs.forEach(item=>{const selected=item===tab;item.setAttribute('aria-selected',String(selected));item.tabIndex=selected?0:-1;});
      frames.forEach(frame=>{frame.hidden=frame.id!==tab.getAttribute('aria-controls');});
      if(focus)tab.focus();
      history.replaceState(null,'','#'+tab.dataset.page);
    }
    tabs.forEach((tab,index)=>{
      tab.addEventListener('click',()=>activate(tab));
      tab.addEventListener('keydown',event=>{
        let next=index;
        if(event.key==='ArrowRight')next=(index+1)%tabs.length;
        else if(event.key==='ArrowLeft')next=(index-1+tabs.length)%tabs.length;
        else if(event.key==='Home')next=0;
        else if(event.key==='End')next=tabs.length-1;
        else return;
        event.preventDefault();activate(tabs[next],true);
      });
    });
    const initial=location.hash.slice(1);
    const initialTab=tabs.find(tab=>tab.dataset.page===initial);
    if(initialTab)activate(initialTab);
  </script>
</body>
</html>
